name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The jet rule analyzes frames on every thread; its test compares that with a serial run.
    env:
      JULIA_NUM_THREADS: "4"
    strategy:
      fail-fast: false
      matrix:
        version: ["1.13", "pre"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # The fatou and jscpd tests run the real tools mise.toml pins, from temp directories mise's shims cannot resolve.
      - uses: jdx/mise-action@v2
      - run: mise bin-paths >> "$GITHUB_PATH"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - name: Require 100% line coverage
        if: matrix.version == '1.13'
        run: |
          sudo apt-get install -y lcov
          lcov --summary lcov.info 2>&1 | tee summary.txt
          awk '/^SF:/ {file = substr($0, 4)} /^DA:[0-9]+,0$/ {print "uncovered:", file, substr($0, 4)}' lcov.info
          grep -Eq 'lines\.*: 100\.0%' summary.txt
      # Coverage blocks inlining and constant folding; users run without it.
      - uses: julia-actions/julia-runtest@v1
        if: matrix.version == '1.13'
        with:
          coverage: false
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: fatou lint --color never src test
  corset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pedantic fatou and jscpd rules run the tools mise.toml pins.
      - uses: jdx/mise-action@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # TestEnv activates the test target's environment, so this step also works in packages that list
      # Corset only as a test dependency.
      - run: julia -e 'using Pkg; Pkg.add("TestEnv")'
      - run: julia --project=. -e 'using TestEnv; TestEnv.activate(); using Corset; exit(Corset.main(ARGS))' -- check . --pedantic --deny-warnings
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: fredrikekre/runic-action@v1
        with:
          version: "1"
