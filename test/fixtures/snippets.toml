[jscpd]
source = '''
function first_copy(alpha::Int, beta::Int)::Int
    scaled = alpha * 3 + beta
    shifted = scaled - alpha * beta
    folded = shifted * shifted + scaled
    bounded = min(folded, alpha + beta * 7)
    return bounded + scaled * shifted
end
function second_copy(alpha::Int, beta::Int)::Int
    scaled = alpha * 3 + beta
    shifted = scaled - alpha * beta
    folded = shifted * shifted + scaled
    bounded = min(folded, alpha + beta * 7)
    return bounded + scaled * shifted
end
'''

